repository:
  allow_auto_merge: true
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

gatekeeper:
  strictChecks: []
  ignoredChecks:
    - advisory

labels:
  - name: bug
    color: d73a4a
    description: Something is not working
  - name: dependencies
    color: 0366d6
    description: Dependency updates
  - name: "won't fix"
    color: ffffff
    # Renames an existing label. Safe to leave in place: it is skipped once
    # the rename has already happened.
    from: wontfix

branchProtection:
  main:
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
    required_status_checks:
      strict: true
      contexts:
        # Requiring only this one check is the point of the gatekeeper: it
        # consolidates every other check into a single required entry, so this
        # list stops needing maintenance as workflows come and go.
        - woodhouse/white-glove
    enforce_admins: false
    required_conversation_resolution: true
    allow_force_pushes: false
    allow_deletions: false
